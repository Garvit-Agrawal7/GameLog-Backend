<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - GameLog</title>

    <style>
        * {
        box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0D1117;
            color: #F5F6F8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: #1A1F2B;
            border: 1px solid #2A3342;
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 16px 40px rgba(0,0,0,.45);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            color: #6C5CE7;
            font-size: 30px;
        }

        p {
            margin: 0 0 28px;
            text-align: center;
            color: #8B95A5;
            line-height: 1.7;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #F5F6F8;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 18px;

            background: #2A3342;
            color: #F5F6F8;

            border: 1px solid #2A3342;
            border-radius: 10px;

            font-size: 15px;
        }

        input::placeholder {
            color: #8B95A5;
        }

        input:focus {
            outline: none;
            border-color: #6C5CE7;
            box-shadow: 0 0 0 3px rgba(108,92,231,.18);
        }

        button {
            width: 100%;
            padding: 15px;

            background: #6C5CE7;
            color: #F5F6F8;

            border: none;
            border-radius: 10px;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: background .2s ease;
        }

        button:hover:not(:disabled) {
            background: #5B4FD1;
        }

        button:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .error {
            color: #EF4444;
            margin-bottom: 18px;
            display: none;
        }

        .success {
            color: #10B981;
            margin-top: 18px;
            text-align: center;
            display: none;
        }

        .failure {
            color: #EF4444;
            margin-top: 18px;
            text-align: center;
            display: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="card hidden" id="resetCard">

    <h1>GameLog</h1>

    <label for="password">New Password</label>
    <input
            id="password"
            type="password"
            autocomplete="new-password"
            placeholder="Enter new password">

    <label for="confirmPassword">Confirm Password</label>
    <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Confirm new password">

    <div class="error" id="error"></div>

    <div style="height: 16px;"></div>

    <button id="resetButton">
        Reset Password
    </button>

    <div class="success" id="success">
        Password reset successfully. You can now return to the GameLog app and sign in.
    </div>

    <div class="failure" id="failure"></div>

</div>

<script>
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const error = document.getElementById("error");
    const success = document.getElementById("success");
    const failure = document.getElementById("failure");
    const button = document.getElementById("resetButton");
    const resetCard = document.getElementById("resetCard");

    const params = new URLSearchParams(window.location.search);
    const token = params.get("code") || "{{RESET_CODE}}";
    const appResetUrl = "{{APP_RESET_URL}}";

    function showError(message) {
        error.textContent = message;
        error.style.display = "block";
    }

    function clearError() {
        error.style.display = "none";
    }

    function showFallbackCard() {
        resetCard.classList.remove("hidden");
    }

    if (appResetUrl) {
        window.location.href = appResetUrl;
        setTimeout(showFallbackCard, 1200);
    } else {
        showFallbackCard();
    }

    async function resetPassword() {

        clearError();
        success.style.display = "none";
        failure.style.display = "none";

        const password = passwordInput.value;
        const confirm = confirmInput.value;

        if (!token) {
            showError("Reset token is missing.");
            return;
        }

        if (!password || !confirm) {
            showError("Please fill in both password fields.");
            return;
        }

        if (password.length < 6) {
            showError("Password must be at least 6 characters long.");
            return;
        }

        if (password !== confirm) {
            showError("Passwords do not match.");
            return;
        }

        button.disabled = true;
        button.textContent = "Resetting...";

        try {

            const response = await fetch("/auth/reset-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token: token,
                    password: password
                })
            });

            if (response.ok) {
                success.style.display = "block";
                passwordInput.disabled = true;
                confirmInput.disabled = true;
                button.style.display = "none";
            } else {

                let message = "Unable to reset password.";

                try {
                    const data = await response.json();

                    if (data.detail) {
                        message = data.detail;
                    }
                } catch (_) {}

                failure.textContent = message;
                failure.style.display = "block";
            }

        } catch (_) {

            failure.textContent =
                "Unable to connect to the server. Please try again later.";
            failure.style.display = "block";

        } finally {

            button.disabled = false;
            button.textContent = "Reset Password";

        }
    }

    confirmInput.addEventListener("input", () => {
        if (
            passwordInput.value &&
            confirmInput.value &&
            passwordInput.value !== confirmInput.value
        ) {
            showError("Passwords do not match.");
        } else {
            clearError();
        }
    });

    passwordInput.addEventListener("input", () => {
        if (
            confirmInput.value &&
            passwordInput.value !== confirmInput.value
        ) {
            showError("Passwords do not match.");
        } else {
            clearError();
        }
    });

    button.addEventListener("click", resetPassword);
</script>

</body>
</html>
