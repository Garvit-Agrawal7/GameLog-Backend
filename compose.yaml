services:
  backend1:
    build: .
    env_file: .env
    environment:
      PORT: ${PORT:-8000}
    restart: unless-stopped

  backend2:
    build: .
    env_file: .env
    environment:
      PORT: ${PORT:-8000}
    restart: unless-stopped

  backend3:
    build: .
    env_file: .env
    environment:
      PORT: ${PORT:-8000}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    environment:
      PORT: ${PORT:-8000}
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
